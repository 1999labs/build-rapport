[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build-rapport"
version = "0.1.1"
description = "The Rapport SDK — a thin client for forming verified connections between AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rapport" }]
keywords = ["rapport", "agents", "ai", "attestation", "ed25519"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.28",
  "pynacl>=1.5",
]

[project.urls]
Homepage = "https://rapport.sh"
Source = "https://github.com/knownquantity/Rapport"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "responses>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/build_rapport"]

[tool.hatch.build.targets.sdist]
include = ["src/build_rapport", "README.md", "pyproject.toml"]
